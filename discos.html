<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discos — La Vaca Loca Records</title><meta name="description" content="Entra a nuestra sala de escucha. Explora discos y prueba sus previews en el tocadiscos."><link rel="stylesheet" href="editorial.css?v=footer-transparent-20260929"><link rel="stylesheet" href="discos.css?v=20261007-library"><script src="data.js" defer></script><script src="api/content" defer></script><script src="draft-preview.js" defer></script><script src="calendar-content.js" defer></script><script src="scratch-audio.js?v=20261007-ready" defer></script><script src="waveform.js?v=20261007-clean" defer></script><script src="discos.js?v=20261007-library" defer></script><link rel="stylesheet" href="ios-header.css?v=20261007"></head>
<body data-page="discos"><a class="skip-link" href="#contenido">Saltar al contenido</a><header class="editorial-header"><a class="brand" href="index.html"><img src="assets/brand/horizontal-logo-black.svg" alt="La Vaca Loca Records — Inicio"></a><nav aria-label="Principal"><a href="discos.html" aria-current="page">Discos</a><a href="sessions.html">Sessions</a><a href="eventos.html">Eventos</a><a href="archivo.html">Archivo</a></nav></header>
<main id="contenido"><section class="listening-room"><div class="room-layout"><div class="deck-area"><div class="deck-stage" id="deckStage" tabindex="0" role="group" aria-label="Tocadiscos interactivo. Arrastra o usa las flechas para cambiar el ángulo.">
  <div class="turntable minimalist-deck" id="turntable">
    <div class="platter">
      <div class="platter-shadow" aria-hidden="true"></div>
      <div class="platter-rim" aria-hidden="true"></div>
      <div class="vinyl" id="vinyl">
        <div class="vinyl-sheen" aria-hidden="true"></div>
        <div class="disc-label"><span id="discLabel">LA VACA<br>LOCA</span></div>
      </div>
      <i class="spindle"></i>
    </div>

    <div class="tonearm-system" aria-hidden="true">
      <div class="arm-mount">
        <span class="mount-ring ring-one"></span>
        <span class="mount-ring ring-two"></span>
        <span class="mount-cap"></span>
        <span class="counterweight"></span>
        <span class="cue-lever"></span>
      </div>
      <div class="tonearm">
        <svg class="tonearm-svg" viewBox="0 0 520 620" focusable="false">
          <defs>
            <linearGradient id="minimalArmMetal" x1="0" x2="1">
              <stop offset="0" stop-color="#1a1a1a"/>
              <stop offset=".22" stop-color="#6b6a67"/>
              <stop offset=".5" stop-color="#20201f"/>
              <stop offset=".78" stop-color="#76736f"/>
              <stop offset="1" stop-color="#171717"/>
            </linearGradient>
          </defs>
          <path class="arm-shadow-path" d="M432 74 C390 112 354 164 322 215 C286 274 245 334 198 389 C160 432 118 468 76 500"/>
          <path class="arm-metal-path" d="M432 74 C390 112 354 164 322 215 C286 274 245 334 198 389 C160 432 118 468 76 500"/>
          <g class="headshell" transform="translate(48 476) rotate(-24)">
            <path d="M8 8 H74 L92 26 L82 45 H18 L5 34 Z"/>
            <circle cx="24" cy="25" r="5"/>
            <circle cx="43" cy="25" r="5"/>
            <circle cx="62" cy="25" r="5"/>
            <path d="M71 42 L64 65"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="deck-hardware">
      <button class="start-stop-control" id="deckPlay" type="button" aria-label="Iniciar disco" aria-pressed="false" disabled>
        <span class="start-stop-ring"><i></i></span>
        <span class="hardware-label">START / STOP</span>
      </button>

      <button class="deck-light-control" id="deckLight" type="button" aria-label="Encender luz del plato" aria-pressed="false">
        <span class="light-post"><i></i></span>
        <span class="hardware-label">LIGHT</span>
      </button>
    </div>


    <div class="tempo-fader" id="tempoFaderModule">
      <div class="tempo-heading"><span>TEMPO</span><output id="tempoValue" for="tempoFader">0.0%</output></div>
      <div class="tempo-slider-wrap">
        <div class="tempo-scale" aria-hidden="true"><span>+8</span><span>+4</span><span>0</span><span>-4</span><span>-8</span></div>
        <input id="tempoFader" class="tempo-range" type="range" min="-8" max="8" step="0.1" value="0" aria-label="Tempo, menos 8 a más 8 por ciento">
      </div>
    </div>

    <button class="pitch-reset-control" id="tempoReset" type="button" aria-label="Restablecer tempo a cero">
      <span></span>
      <small>RESET</small>
    </button>



    <div class="deck-branding" aria-hidden="true">
      <img src="assets/brand/horizontal-logo-black.svg" alt="">
    </div>
  </div>
</div>
    <div class="deck-playback-timeline">
      <span class="deck-time" id="deckCurrent">0:00</span>
      <div class="deck-waveform"><canvas id="audioWaveform" aria-hidden="true"></canvas><input id="seek" class="deck-seek" type="range" min="0" max="100" step="0.1" value="0" disabled aria-label="Posición del audio"></div>
      <span class="deck-time" id="deckDuration">0:00</span>
    </div>
</div>
<div class="library-column">
  <aside class="listening-panel">
    <div class="now-playing-head"><p class="eyebrow">DISCO SELECCIONADO</p></div>
    <div class="selected-record">
      <div class="sleeve-zone" id="sleeveZone">
        <div class="sleeve-disc-preview" id="sleeveDiscPreview" aria-hidden="true"><span id="sleeveDiscLabel"></span></div>
        <div class="selected-artwork" id="selectedArtwork" aria-hidden="true">
          <img id="selectedArtworkImage" alt="" hidden>
        </div>
      </div>
      <div class="selected-record-copy">
        <div class="now-playing-copy">
          <div><h2 id="recordTitle">Elige un disco</h2><p id="recordArtist"></p></div>
          <div class="record-buy">
            <strong id="recordPrice"></strong>
            <span class="record-stock" id="recordStock"></span>
            <a id="recordInquiry" hidden target="_blank" rel="noopener noreferrer">Consultar ↗</a>
          </div>
        </div>
        <dl id="recordInfo" class="record-facts"></dl>
        <p id="recordDescription"></p>
      </div>
    </div>
    <p id="playerNotice" class="sr-only" role="status" aria-live="polite"></p>
  </aside>

  <section class="collection" id="coleccion">
    <div class="library-toolbar">
      <button class="library-label" id="libraryToggle" type="button" aria-expanded="true" aria-controls="discGallery">
        <span class="eyebrow">BIBLIOTECA</span>
        <span class="library-state"><span id="resultCount" aria-live="polite"></span><i aria-hidden="true">⌄</i></span>
      </button>
      <div class="browse-tools">
        <label>Buscar<input id="recordSearch" type="search" placeholder="Artista, título o sello…"></label>
        <label>Género<select id="genreFilter"><option value="">Todos</option></select></label>
      </div>
    </div>
    <div id="discGallery" class="disc-gallery"></div>
    <noscript>Activa JavaScript para explorar la colección y escuchar los previews.</noscript>
  </section>
</div></div></section></main>
<div class="transport-disc" id="transportDisc" aria-hidden="true"><span id="transportDiscLabel"></span></div>
<audio id="recordAudio" preload="auto"></audio>
<footer class="editorial-footer"><div><a class="store-signature" href="index.html" aria-label="La Vaca Loca Records — inicio"><img src="assets/brand/footer-signature.svg?v=white-type-20260929" alt="La Vaca Loca Record Store" width="274" height="312" loading="lazy"></a><p>Gualaceo, Ecuador · discos · sessions · cultura</p></div><nav aria-label="Pie de página"><a href="sessions.html">Sessions</a><a href="eventos.html">Eventos</a><a href="archivo.html">Archivo</a></nav><p class="design-credit"><a href="https://www.instagram.com/semiotice/" target="_blank" rel="noopener noreferrer">Website Design by Sebastian Llivichuzhca</a></p></footer><script src="ios-header.js?v=20261007"></script></body></html>
