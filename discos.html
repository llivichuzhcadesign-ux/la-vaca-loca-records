<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discos — La Vaca Loca Records</title><meta name="description" content="Entra a nuestra sala de escucha. Explora discos y prueba sus previews en el tocadiscos."><link rel="stylesheet" href="editorial.css?v=footer-transparent-20260929"><link rel="stylesheet" href="discos.css?v=20261016-bottom-waveform"><script src="data.js" defer></script><script src="api/content" defer></script><script src="draft-preview.js" defer></script><script src="calendar-content.js" defer></script><script src="scratch-audio.js?v=20261007-ready" defer></script><script src="waveform.js?v=20261017-sonic-footer-v1" defer></script><script src="discos.js?v=20261016-bottom-waveform" defer></script><link rel="stylesheet" href="ios-header.css?v=20261007-page-colors"><link rel="stylesheet" href="public-header.css?v=20261007-underline"><link rel="stylesheet" href="bag.css?v=20261007-green-panel"><link rel="stylesheet" href="footer-sign.css?v=20261017-cow-arrival-v1"></head>
<body data-page="discos"><a class="skip-link" href="#contenido">Saltar al contenido</a><header class="editorial-header"><a class="brand" href="index.html"><img src="assets/brand/horizontal-logo-black.svg" alt="La Vaca Loca Records — Inicio"></a><nav aria-label="Principal"><a href="discos.html" aria-current="page">Discos</a><a href="sessions.html">Sessions</a><a href="eventos.html">Eventos</a><a href="archivo.html">Archivo</a></nav><a class="header-bag" href="index.html?bag=1" aria-label="Abrir la canasta de compras"><img src="assets/brand/carrizo-basket.svg" alt=""></a></header>
<main id="contenido"><section class="listening-room"><div class="room-layout"><div class="deck-area"><div class="deck-stage" id="deckStage" tabindex="0" role="group" aria-label="Tocadiscos interactivo. Arrastra o usa las flechas para cambiar el ángulo.">
  <div class="turntable minimalist-deck" id="turntable">
    <div class="platter">
      <div class="platter-shadow" aria-hidden="true"></div>
      <div class="platter-rim" aria-hidden="true"></div>
      <div class="vinyl" id="vinyl">
        <div class="vinyl-sheen" aria-hidden="true"></div>
        <div class="disc-label"><span id="discLabel">LA VACA<br>LOCA</span></div>
      </div>
      <i class="spindle"></i>
    </div>

    <div class="tonearm-system" aria-hidden="true">
      <div class="arm-mount">
        <span class="mount-ring ring-one"></span>
        <span class="mount-ring ring-two"></span>
        <span class="mount-cap"></span>
        <span class="counterweight"></span>
        <span class="cue-lever"></span>
      </div>
      <div class="tonearm">
        <svg class="tonearm-svg" viewBox="0 0 520 620" focusable="false">
          <defs>
            <linearGradient id="minimalArmMetal" x1="0" x2="1">
              <stop offset="0" stop-color="#1a1a1a"/>
              <stop offset=".22" stop-color="#6b6a67"/>
              <stop offset=".5" stop-color="#20201f"/>
              <stop offset=".78" stop-color="#76736f"/>
              <stop offset="1" stop-color="#171717"/>
            </linearGradient>
          </defs>
          <path class="arm-shadow-path" d="M432 74 C390 112 354 164 322 215 C286 274 245 334 198 389 C160 432 118 468 76 500"/>
          <path class="arm-metal-path" d="M432 74 C390 112 354 164 322 215 C286 274 245 334 198 389 C160 432 118 468 76 500"/>
          <g class="headshell" transform="translate(48 476) rotate(-24)">
            <path d="M8 8 H74 L92 26 L82 45 H18 L5 34 Z"/>
            <circle cx="24" cy="25" r="5"/>
            <circle cx="43" cy="25" r="5"/>
            <circle cx="62" cy="25" r="5"/>
            <path d="M71 42 L64 65"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="deck-hardware">
      <button class="start-stop-control" id="deckPlay" type="button" aria-label="Iniciar disco" aria-pressed="false" disabled>
        <span class="start-stop-ring"><i></i></span>
        <span class="hardware-label">START / STOP</span>
      </button>

      <button class="deck-light-control" id="deckLight" type="button" aria-label="Encender luz del plato" aria-pressed="false">
        <span class="light-post"><i></i></span>
        <span class="hardware-label">LIGHT</span>
      </button>
    </div>


    <div class="tempo-fader" id="tempoFaderModule">
      <div class="tempo-heading"><span>TEMPO</span><output id="tempoValue" for="tempoFader">0.0%</output></div>
      <div class="tempo-slider-wrap">
        <div class="tempo-scale" aria-hidden="true"><span>+8</span><span>+4</span><span>0</span><span>-4</span><span>-8</span></div>
        <input id="tempoFader" class="tempo-range" type="range" min="-8" max="8" step="0.1" value="0" aria-label="Tempo, menos 8 a más 8 por ciento">
      </div>
    </div>

    <button class="pitch-reset-control" id="tempoReset" type="button" aria-label="Restablecer tempo a cero">
      <span></span>
      <small>RESET</small>
    </button>



    <div class="deck-branding" aria-hidden="true">
      <img src="assets/brand/horizontal-logo-black.svg" alt="">
    </div>
  </div>
</div>
    <div class="deck-playback-timeline">
      <span class="deck-time" id="deckCurrent">0:00</span>
      <div class="deck-waveform"><canvas id="audioWaveform" aria-hidden="true"></canvas><input id="seek" class="deck-seek" type="range" min="0" max="100" step="0.1" value="0" disabled aria-label="Posición del audio"></div>
      <span class="deck-time" id="deckDuration">0:00</span>
    </div>
</div>
<div class="library-column">
  <aside class="listening-panel"><button id="iosTurntableToggle" class="ios-turntable-toggle" type="button" aria-label="Abrir tocadiscos" aria-pressed="false"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="4" width="24" height="20" rx="3"/><circle cx="11" cy="14" r="6"/><circle cx="11" cy="14" r="1.5"/><path d="M22 8v7l-3 4M20 8h4"/></svg></button>
    <div class="now-playing-head"><p class="eyebrow">DISCO SELECCIONADO</p></div>
    <div class="selected-record">
      <div class="sleeve-zone" id="sleeveZone">
        <div class="sleeve-disc-preview" id="sleeveDiscPreview" aria-hidden="true"><span id="sleeveDiscLabel"></span></div>
        <div class="selected-artwork" id="selectedArtwork" aria-hidden="true">
          <img id="selectedArtworkImage" alt="" hidden>
        </div>
      </div>
      <div class="selected-record-copy">
        <div class="now-playing-copy">
          <div><h2 id="recordTitle">Elige un disco</h2><p id="recordArtist"></p></div>
          <div class="record-buy">
            <strong id="recordPrice"></strong>
            <span class="record-stock" id="recordStock"></span>
            <div class="record-actions"><button id="recordLike" type="button" aria-label="Guardar favorito" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></button><button id="recordBag" type="button" aria-label="Añadir a la canasta"><img src="assets/brand/carrizo-basket.svg" alt=""></button></div>
            <a id="recordInquiry" hidden target="_blank" rel="noopener noreferrer">Consultar ↗</a>
          </div>
        </div>
        <dl id="recordInfo" class="record-facts"></dl>
        <p id="recordDescription"></p>
        <button class="artwork-open" id="artworkOpen" type="button">Ver portada ↗</button>
      </div>
    </div>
    <p id="playerNotice" class="sr-only" role="status" aria-live="polite"></p>
  </aside>

  <section class="collection" id="coleccion">
    <aside class="biblioteca-sidebar" aria-label="Navegación de biblioteca">
      <button class="library-deck-button" type="button" data-disc-view="player" aria-label="Abrir tocadiscos"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="26" height="24" rx="3"/><circle cx="13" cy="16" r="7"/><circle cx="13" cy="16" r="2"/><path d="M24 9v10l-4 4M22 9h4"/></svg><span>Tocadiscos</span></button>
      <button id="libraryNavHome" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3Z"/></svg><span>Discover</span></button><span class="library-nav-caption">Tu biblioteca</span>
      <button id="libraryNavAll" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Todos los discos</span></button>
      <button id="libraryNavLiked" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg><span>Discos que te gustan</span></button>
      <button id="libraryNavBag" type="button"><img src="assets/brand/carrizo-basket.svg" alt=""><span>Canasta</span></button>
      <span class="library-nav-caption library-genres-caption">Géneros</span>
      <div id="libraryGenres" class="library-genres"></div>
    </aside>
    <div class="library-page-heading"><button id="libraryBack" type="button" hidden aria-label="Volver a la biblioteca">← Volver</button><h1 id="libraryPageTitle" tabindex="-1">Biblioteca</h1><p id="librarySearchSummary" class="library-search-summary" aria-live="polite" hidden></p></div><section id="libraryDiscDetail" class="library-disc-detail" hidden aria-label="Detalle del disco"></section>
    <section class="library-playlists" aria-labelledby="libraryPlaylistTitle"><div class="library-section-heading"><h2 id="libraryPlaylistTitle">Selecciones de La Vaca Loca</h2></div><div class="library-cover-row" id="libraryCoverRow" aria-label="Playlist, favoritos y géneros"></div></section>
    <div class="library-toolbar">
      <div class="library-view-switch" role="group" aria-label="Vista de discos"><button type="button" data-disc-view="player" aria-pressed="true">Tocadiscos</button><button type="button" data-disc-view="library" aria-pressed="false">Biblioteca</button></div>
      <button class="library-label" id="libraryToggle" type="button" aria-expanded="true" aria-controls="discGallery">
        <span class="eyebrow">BIBLIOTECA</span>
        <span class="library-state"><span id="resultCount" aria-live="polite"></span><i aria-hidden="true">⌄</i></span>
      </button>
      <div class="browse-tools">
        <div class="library-search-field"><label for="recordSearch">Buscar</label><input id="recordSearch" type="search" placeholder="Artista, título o sello…"><button id="librarySearchClear" type="button" aria-label="Borrar búsqueda" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div>
        <label>Género<select id="genreFilter"><option value="">Todos</option></select></label>
      </div>
    </div>
    <div id="discGallery" class="disc-gallery"></div>
    <noscript>Activa JavaScript para explorar la colección y escuchar los previews.</noscript>
  </section>
</div></div><div class="library-mini-player" hidden><div><strong id="libraryPlayerTitle"></strong><span id="libraryPlayerArtist"></span></div><button id="libraryPlayerPlay" type="button" aria-label="Reproducir">Reproducir</button><button type="button" data-disc-view="player">Abrir tocadiscos ↗</button></div></section></main>
<div class="transport-disc" id="transportDisc" aria-hidden="true"><span id="transportDiscLabel"></span></div>
<dialog class="artwork-dialog" id="artworkDialog" aria-labelledby="artworkCaption">
  <div class="artwork-dialog-head"><p id="artworkCaption"></p><div><button id="artworkZoom" type="button" aria-pressed="false">Ampliar</button><button id="artworkClose" type="button" aria-label="Cerrar portada">Cerrar ×</button></div></div>
  <div class="artwork-dialog-stage" id="artworkStage"><img id="artworkFull" alt=""></div>
</dialog>
<audio id="recordAudio" preload="auto"></audio>
<footer class="editorial-footer" data-lvl-footer><nav aria-label="Pie de página"><a href="index.html">Inicio</a><a href="discos.html">Discos</a><a href="sessions.html">Sessions</a><a href="eventos.html">Eventos</a><a href="archivo.html">Archivo</a></nav></footer><script src="ios-header.js?v=20261007-layout"></script><script src="bag.js?v=20261007-green-panel" defer></script><script src="footer-sign.js?v=20261017-cow-arrival-v1"></script></body></html>
