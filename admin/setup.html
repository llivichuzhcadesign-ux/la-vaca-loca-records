<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial admin setup — LVL</title><style>body{font:16px Arial,sans-serif;background:#181c18;color:white;max-width:420px;margin:8vh auto;padding:20px}label{display:block;margin:18px 0 7px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit}input{background:#262c26;color:white;border:1px solid #637063;border-radius:6px}button{margin-top:24px;background:#78906e;border:0;border-radius:6px}p{line-height:1.5}#out{color:#b9d1ae}</style></head><body><h1>Set up administrator</h1><p>One-time setup. Enter the private setup token configured in Cloudflare, then create the admin account.</p><form id="form"><label for="token">Setup token</label><input id="token" type="password" required><label for="email">Admin email</label><input id="email" type="email" required><label for="password">Admin password (14+ characters)</label><input id="password" type="password" minlength="14" autocomplete="new-password" required><button>Create administrator</button></form><p id="out" role="status"></p><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('out');out.textContent='Creating account…';try{const r=await fetch('/api/auth/setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({setupToken:document.getElementById('token').value,email:document.getElementById('email').value,password:document.getElementById('password').value})});const type=r.headers.get('content-type')||'';if(!type.includes('application/json'))throw Error('Setup API returned HTML instead of JSON (HTTP '+r.status+'). Verify the Pages Functions deployment and route /api/auth/setup.');const d=await r.json();if(!r.ok)throw Error(d.error||'Setup failed (HTTP '+r.status+')');out.textContent='Account created. Remove the setup secret after setup. Redirecting…';setTimeout(()=>location.assign('./login.html'),1200)}catch(ex){out.textContent=ex.message}})</script></body></html>
