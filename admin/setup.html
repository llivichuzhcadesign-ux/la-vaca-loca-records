<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Initial admin setup — LVL</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#eee5d3;background:#080807;color-scheme:dark}
*{box-sizing:border-box}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;margin:0;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel{width:min(100%,420px);padding:clamp(22px,5vw,36px);border:1px solid rgba(238,229,211,.22);background:#151310}
.brand{font-size:11px;font-weight:900;letter-spacing:.14em;color:#ff5aa7;line-height:1.5}
h1{font-size:clamp(29px,8vw,39px);letter-spacing:-.05em;line-height:1.04;margin:27px 0 8px}
p{color:#b9ad9a;font-size:14px;line-height:1.6;margin:12px 0}
label{display:block;margin:19px 0 8px;font-size:13px;font-weight:700}
input{display:block;width:100%;min-width:0;min-height:50px;padding:13px;color:#eee5d3;background:#0c0b0a;border:1px solid rgba(238,229,211,.35);border-radius:0;font:inherit;font-size:16px}
input:focus{outline:2px solid #ff5aa7;outline-offset:0;border-color:#ff5aa7}
button{display:block;width:100%;min-height:50px;padding:13px;margin-top:24px;border:0;border-radius:0;background:#ff5aa7;color:#080807;font:inherit;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid #eee5d3;outline-offset:3px}
#error{color:#ffb5b5;min-height:20px}
@media(max-width:380px){.panel{padding:22px}h1{margin-top:20px}}
body{display:block;max-width:460px;margin:auto;padding-top:calc(34px + env(safe-area-inset-top,0px))}h1{font-size:clamp(28px,7vw,38px)}#out{min-height:24px;color:#d2e7c9}</style></head><body><h1>Set up administrator</h1><p>One-time setup. Enter the private setup token configured in Cloudflare, then create the admin account.</p><form id="form"><label for="token">Setup token</label><input id="token" type="password" required><label for="email">Admin email</label><input id="email" type="email" required><label for="password">Admin password (14+ characters)</label><input id="password" type="password" minlength="14" autocomplete="new-password" required><button>Create administrator</button></form><p id="out" role="status"></p><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('out');out.textContent='Creating account…';try{const r=await fetch('/api/auth/setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({setupToken:document.getElementById('token').value,email:document.getElementById('email').value,password:document.getElementById('password').value})});const type=r.headers.get('content-type')||'';if(!type.includes('application/json'))throw Error('Setup API returned HTML instead of JSON (HTTP '+r.status+'). Verify the Pages Functions deployment and route /api/auth/setup.');const d=await r.json();if(!r.ok)throw Error(d.error||'Setup failed (HTTP '+r.status+')');out.textContent='Account created. Remove the setup secret after setup. Redirecting…';setTimeout(()=>location.assign('./login.html'),1200)}catch(ex){out.textContent=ex.message}})</script></body></html>
