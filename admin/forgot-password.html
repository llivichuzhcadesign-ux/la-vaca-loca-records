<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Request password reset — La Vaca Loca Records</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#eee5d3;background:#080807;color-scheme:dark}
*{box-sizing:border-box}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;margin:0;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel{width:min(100%,450px);padding:clamp(23px,5vw,38px);background:#151310;border:1px solid rgba(238,229,211,.22)}
.brand{color:#ff5aa7;font-weight:900;letter-spacing:.12em;font-size:11px;text-transform:uppercase}
h1{font-size:clamp(31px,7vw,43px);letter-spacing:-.055em;line-height:1.05;margin:26px 0 10px}
p{color:#b9ad9a;font-size:14px;line-height:1.65}
.invited{background:#0d0c0b;border:1px solid rgba(238,229,211,.18);padding:13px 15px;margin:21px 0;overflow-wrap:anywhere}
.invited strong,.invited span{display:block}
.invited strong{font-size:15px;line-height:1.5;color:#eee5d3}
.invited span{font-size:12px;letter-spacing:.04em;margin-top:4px;color:#ff9fc7}
label{display:block;margin:19px 0 8px;font-weight:700;font-size:13px}
input{width:100%;min-height:50px;padding:13px;border:1px solid rgba(238,229,211,.34);background:#0b0a09;color:#eee5d3;border-radius:0;font:inherit;font-size:16px}
input:focus{outline:2px solid #ff5aa7;outline-offset:0;border-color:#ff5aa7}
button,.link-button{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:22px;padding:13px;background:#ff5aa7;color:#0b080a;border:0;border-radius:0;font-weight:900;font-size:12px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer}
button:disabled{cursor:wait;opacity:.55}
button:focus-visible,.link-button:focus-visible{outline:2px solid #eee5d3;outline-offset:3px}
.note{font-size:12px;margin-top:10px}
.error{color:#ffb3b3;min-height:20px}
.success{color:#b9eac7}
[hidden]{display:none!important}

.back-link{display:inline-block;color:#eee5d3;text-decoration:underline;margin-top:18px;font-size:13px}
</style>
</head>
<body>
<main class="panel">
 <div class="brand">La Vaca Loca Records / Administration</div>
 <h1 id="title">Forgot password?</h1>
 <p id="description">Enter your administrator email. The website owner can approve the request and send you a private password-reset link.</p>
 <form id="requestForm">
  <label for="email">Account email</label>
  <input type="email" id="email" name="email" autocomplete="username" maxlength="254" required>
  <button id="requestButton" type="submit">Request password reset</button>
 </form>
 <p id="feedback" class="error" role="status" aria-live="polite"></p>
 <a class="back-link" href="./login.html">Return to sign in</a>
</main>
<script>
(()=>{
 const form=document.getElementById('requestForm');
 const button=document.getElementById('requestButton');
 const feedback=document.getElementById('feedback');
 form.addEventListener('submit',async event=>{
  event.preventDefault();
  button.disabled=true;
  feedback.textContent='';
  try{
   const response=await fetch('../api/auth/password-reset',{
    method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({action:'request',email:document.getElementById('email').value}),
    cache:'no-store'
   });
   const data=await response.json();
   if(!response.ok)throw Error(data.error||'Could not submit the request.');
   form.hidden=true;
   document.getElementById('title').textContent='Request received';
   document.getElementById('description').textContent='If your account is eligible, the request is now available to the website owner. Contact them directly to receive your reset link. No email is sent automatically.';
   feedback.textContent='';
  }catch(error){feedback.textContent=error.message}
  finally{button.disabled=false}
 });
})();
</script>
</body>
</html>
