<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in — La Vaca Loca Records</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f5f6f2;background:#161a16}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;box-sizing:border-box}.panel{width:min(100%,360px);padding:36px;border:1px solid #333e33;border-radius:16px;background:#202820;box-sizing:border-box}.brand{font-size:12px;letter-spacing:.15em;color:#b3c1ac}h1{font-size:26px;margin:24px 0 8px}p{color:#b3c1ac;font-size:14px;line-height:1.5}label{display:block;margin:22px 0 7px;font-size:13px}input{box-sizing:border-box;width:100%;padding:13px;color:#fff;background:#141914;border:1px solid #52614e;border-radius:8px;font:inherit}button{margin-top:24px;width:100%;padding:13px;border:0;border-radius:8px;background:#748c68;color:#0c140a;font-weight:700;cursor:pointer}button:disabled{opacity:.6}#error{color:#f4b1a8;min-height:20px}</style></head><body><main class="panel"><div class="brand">LA VACA LOCA RECORDS</div><h1>Admin sign in</h1><p>Manage your website securely.</p><form id="form"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required><button id="submit">Sign in</button></form><p id="error" role="alert"></p></main><script>
const form=document.getElementById('form'),error=document.getElementById('error');form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';const btn=document.getElementById('submit');btn.disabled=true;try{const response=await fetch('../api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Sign in failed');location.replace('./')}catch(e){error.textContent=e.message}finally{btn.disabled=false}});if(location.search.includes('setup'))error.textContent='Admin setup is not complete. Configure Cloudflare D1 first.';
</script></body></html>
