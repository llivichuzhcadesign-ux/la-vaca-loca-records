<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin sign in — La Vaca Loca Records</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#eee5d3;background:#080807;color-scheme:dark}
*{box-sizing:border-box}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;margin:0;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel{width:min(100%,420px);padding:clamp(22px,5vw,36px);border:1px solid rgba(238,229,211,.22);background:#151310}
.brand{font-size:11px;font-weight:900;letter-spacing:.14em;color:#ff5aa7;line-height:1.5}
h1{font-size:clamp(29px,8vw,39px);letter-spacing:-.05em;line-height:1.04;margin:27px 0 8px}
p{color:#b9ad9a;font-size:14px;line-height:1.6;margin:12px 0}
label{display:block;margin:19px 0 8px;font-size:13px;font-weight:700}
input{display:block;width:100%;min-width:0;min-height:50px;padding:13px;color:#eee5d3;background:#0c0b0a;border:1px solid rgba(238,229,211,.35);border-radius:0;font:inherit;font-size:16px}
input:focus{outline:2px solid #ff5aa7;outline-offset:0;border-color:#ff5aa7}
button{display:block;width:100%;min-height:50px;padding:13px;margin-top:24px;border:0;border-radius:0;background:#ff5aa7;color:#080807;font:inherit;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid #eee5d3;outline-offset:3px}
#error{color:#ffb5b5;min-height:20px}
@media(max-width:380px){.panel{padding:22px}h1{margin-top:20px}}
</style></head><body><main class="panel"><div class="brand">LA VACA LOCA RECORDS</div><h1>Admin sign in</h1><p>Manage your website securely.</p><form id="form"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required><button id="submit">Sign in</button></form><p id="error" role="alert"></p></main><script>
const form=document.getElementById('form'),error=document.getElementById('error');form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';const btn=document.getElementById('submit');btn.disabled=true;try{const response=await fetch('../api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'Sign in failed');location.replace('./')}catch(e){error.textContent=e.message}finally{btn.disabled=false}});if(location.search.includes('setup'))error.textContent='Admin setup is not complete. Configure Cloudflare D1 first.';
</script></body></html>
