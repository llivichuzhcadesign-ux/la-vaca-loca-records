<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Accept invitation — La Vaca Loca Records</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#eee5d3;background:#080807;color-scheme:dark}
*{box-sizing:border-box}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;margin:0;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel{width:min(100%,450px);padding:clamp(23px,5vw,38px);background:#151310;border:1px solid rgba(238,229,211,.22)}
.brand{color:#ff5aa7;font-weight:900;letter-spacing:.12em;font-size:11px;text-transform:uppercase}
h1{font-size:clamp(31px,7vw,43px);letter-spacing:-.055em;line-height:1.05;margin:26px 0 10px}
p{color:#b9ad9a;font-size:14px;line-height:1.65}
.invited{background:#0d0c0b;border:1px solid rgba(238,229,211,.18);padding:13px 15px;margin:21px 0;overflow-wrap:anywhere}
.invited strong,.invited span{display:block}
.invited strong{font-size:15px;line-height:1.5;color:#eee5d3}
.invited span{font-size:12px;letter-spacing:.04em;margin-top:4px;color:#ff9fc7}
label{display:block;margin:19px 0 8px;font-weight:700;font-size:13px}
input{width:100%;min-height:50px;padding:13px;border:1px solid rgba(238,229,211,.34);background:#0b0a09;color:#eee5d3;border-radius:0;font:inherit;font-size:16px}
input:focus{outline:2px solid #ff5aa7;outline-offset:0;border-color:#ff5aa7}
button,.link-button{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:22px;padding:13px;background:#ff5aa7;color:#0b080a;border:0;border-radius:0;font-weight:900;font-size:12px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer}
button:disabled{cursor:wait;opacity:.55}
button:focus-visible,.link-button:focus-visible{outline:2px solid #eee5d3;outline-offset:3px}
.note{font-size:12px;margin-top:10px}
.error{color:#ffb3b3;min-height:20px}
.success{color:#b9eac7}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="panel">
 <div class="brand">La Vaca Loca Records / Administration</div>
 <h1 id="title">Your invitation</h1>
 <p id="intro">Checking your private invitation link…</p>
 <section id="details" class="invited" hidden aria-label="Invitation details">
  <strong id="invitedEmail"></strong>
  <span id="invitedRole"></span>
 </section>
 <form id="acceptForm" hidden>
  <label for="password">Create your password</label>
  <input id="password" name="password" type="password" minlength="14" maxlength="1024" autocomplete="new-password" required>
  <label for="confirmPassword">Confirm your password</label>
  <input id="confirmPassword" name="confirmPassword" type="password" minlength="14" maxlength="1024" autocomplete="new-password" required>
  <p class="note">Use at least 14 characters. Your password is only sent securely to the administrator login service; the person inviting you never sees it.</p>
  <button id="acceptButton" type="submit">Create my account</button>
 </form>
 <p id="feedback" class="error" role="alert" aria-live="polite"></p>
 <a id="signInLink" class="link-button" href="./login.html" hidden>Go to sign in</a>
</main>
<script>
(()=>{
 const qs=new URLSearchParams(location.hash.slice(1));
 const token=qs.get('token')||'';
 const title=document.getElementById('title');
 const intro=document.getElementById('intro');
 const feedback=document.getElementById('feedback');
 const form=document.getElementById('acceptForm');
 const details=document.getElementById('details');
 const signIn=document.getElementById('signInLink');
 const button=document.getElementById('acceptButton');
 async function request(action,fields={}){
  const response=await fetch('../api/auth/invite',{
   method:'POST',headers:{'content-type':'application/json'},
   body:JSON.stringify({action,token,...fields}),
   cache:'no-store',referrerPolicy:'no-referrer'
  });
  const data=await response.json();
  if(!response.ok)throw Error(data.error||'Invitation could not be verified.');
  return data;
 }
 async function start(){
  if(!/^[a-f0-9]{64}$/.test(token)){
   title.textContent='Invalid invitation';
   intro.textContent='Please request a new invitation link from your website administrator.';
   return;
  }
  try{
   const data=await request('inspect');
   title.textContent='Create your account';
   intro.textContent='You have been invited to manage La Vaca Loca Records. Choose a private password to activate your access.';
   document.getElementById('invitedEmail').textContent=data.email;
   document.getElementById('invitedRole').textContent='Role: '+(data.role==='admin'?'Administrator':data.role==='owner'?'Owner':'Editor');
   details.hidden=false;form.hidden=false;
  }catch(error){
   title.textContent='Invitation unavailable';
   intro.textContent=error.message+' Contact the website administrator for a replacement link.';
  }
 }
 form.addEventListener('submit',async event=>{
  event.preventDefault();
  const password=document.getElementById('password').value;
  const confirmPassword=document.getElementById('confirmPassword').value;
  feedback.textContent='';
  if(password.length<14||password!==confirmPassword){
   feedback.textContent=password.length<14?'Your password must contain at least 14 characters.':'The passwords do not match.';
   return;
  }
  button.disabled=true;
  button.textContent='ACTIVATING ACCOUNT…';
  try{
   await request('accept',{password,confirmPassword});
   history.replaceState(null,'',location.pathname);
   form.reset();form.hidden=true;
   title.textContent='Account ready';
   intro.textContent='Your password has been created successfully. You can now sign in with your invited email address.';
   feedback.textContent='';details.hidden=false;signIn.hidden=false;
  }catch(error){feedback.textContent=error.message}
  finally{button.disabled=false;button.textContent='Create my account'}
 });
 start();
})();
</script>
</body>
</html>
